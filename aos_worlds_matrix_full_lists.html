
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{padding:12px 0;font-family:var(--font-sans)}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:0.5px solid var(--color-border-tertiary);flex-wrap:wrap;gap:8px}
.htitle{font-size:17px;font-weight:500;color:var(--color-text-primary)}
.hsub{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.rpills{display:flex;gap:5px;flex-wrap:wrap}
.rp{padding:5px 12px;font-size:12px;font-weight:500;border:0.5px solid var(--color-border-secondary);border-radius:20px;cursor:pointer;background:transparent;color:var(--color-text-secondary)}
.rp:hover{background:var(--color-background-secondary)}
.rp.on{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.maps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;padding:8px 12px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);align-items:center}
.ml{font-size:11px;font-weight:500;color:var(--color-text-primary);margin-right:4px}
.mc{font-size:11px;color:var(--color-text-secondary);padding:3px 10px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:10px}
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:0.5px solid var(--color-border-tertiary)}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:var(--color-text-secondary);border-bottom:2px solid transparent;background:transparent;margin-bottom:-1px;font-weight:400}
.tab:hover{color:var(--color-text-primary)}
.tab.on{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary);font-weight:500}
.sec{display:none}.sec.on{display:block}
.nrow{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.nrow label{font-size:13px;color:var(--color-text-secondary)}
.nrow select{font-size:14px;padding:7px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);flex:1;min-width:160px;max-width:260px}
.dbtn{padding:7px 14px;font-size:12px;font-weight:500;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);cursor:pointer;background:transparent;color:var(--color-text-secondary)}
.dbtn.on{background:#e1f5ee;color:#085041;border-color:#1d9e75}
.leg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.li{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--color-text-secondary)}
.ls{width:20px;height:12px;border-radius:3px;border:0.5px solid}
.mscroll{overflow-x:auto;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg)}
table.mx{border-collapse:collapse;font-size:12px;width:100%}
table.mx th{padding:6px 6px;font-weight:500;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary);white-space:nowrap;background:var(--color-background-primary);font-size:11px}
th.corn{min-width:140px;text-align:left;padding-left:12px;position:sticky;left:0;z-index:3;border-right:0.5px solid var(--color-border-tertiary)}
.oth{cursor:pointer;text-align:center;border-left:0.5px solid var(--color-border-tertiary)}
.oth:hover{background:var(--color-background-secondary)}
.abar{height:3px;border-radius:2px;margin:0 auto 4px;width:28px}
.on1{font-size:11px;font-weight:500;color:var(--color-text-primary);display:block}
.on2{font-size:10px;color:var(--color-text-secondary);display:block;margin-top:1px}
table.mx tbody tr:hover{background:var(--color-background-secondary)}
table.mx tbody td{padding:3px 4px;border-bottom:0.5px solid var(--color-border-tertiary);border-left:0.5px solid var(--color-border-tertiary);text-align:center;vertical-align:middle}
td.bgr{position:sticky;left:0;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);border-left:none;padding:6px 10px 6px 12px;text-align:left;z-index:2}
.bn{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.ba{font-size:10px;color:var(--color-text-secondary);margin-top:2px;display:flex;align-items:center;gap:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cb{width:52px;height:28px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;font-size:11px;font-weight:500;background:transparent;color:var(--color-text-secondary);touch-action:manipulation}
.cb:hover{transform:scale(1.1)}
.cb:active{transform:scale(.93)}
.cb.BW{background:#dcfce7;color:#14532d;border-color:#16a34a}
.cb.SW{background:#d1fae5;color:#064e3b;border-color:#059669}
.cb.D{background:#f1f0eb;color:#3d3b34;border-color:#9e9b94}
.cb.SL{background:#fef3c7;color:#78350f;border-color:#d97706}
.cb.BL{background:#fee2e2;color:#7f1d1d;border-color:#dc2626}
.cb.R{background:#ede9fe;color:#2e1065;border-color:#7c3aed}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:16px}
.nc{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;cursor:pointer;background:var(--color-background-primary)}
.nc:hover{border-color:var(--color-border-primary)}
.nc.drn{border-color:#16a34a;background:#f0fdf4}
.ncn{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.nbg{font-size:9px;padding:1px 6px;border-radius:8px;background:#dcfce7;color:#14532d;border:0.5px solid #16a34a;margin-left:4px;vertical-align:middle}
.ncs{font-size:10px;color:var(--color-text-secondary);margin-top:3px;line-height:1.5}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:8px}
.dcard{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px}
.dch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dcn{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.dcs{font-size:18px;font-weight:500}
.pos{color:#16a34a}.neg{color:#dc2626}.neu{color:var(--color-text-secondary)}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.chip{font-size:10px;font-weight:500;padding:2px 7px;border-radius:10px;border:0.5px solid var(--color-border-tertiary);color:var(--color-text-secondary);background:var(--color-background-secondary)}
.chip.BW{background:#dcfce7;color:#14532d;border-color:#16a34a}
.chip.SW{background:#d1fae5;color:#064e3b;border-color:#059669}
.chip.D{background:#f1f0eb;color:#3d3b34;border-color:#9e9b94}
.chip.SL{background:#fef3c7;color:#78350f;border-color:#d97706}
.chip.BL{background:#fee2e2;color:#7f1d1d;border-color:#dc2626}
.chip.R{background:#ede9fe;color:#2e1065;border-color:#7c3aed}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.scard{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:16px;text-align:center}
.sn{font-size:13px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px}
.ss{font-size:32px;font-weight:500;line-height:1}
.ssub{font-size:11px;color:var(--color-text-secondary);margin-top:4px}
.grand{background:var(--color-text-primary);color:var(--color-background-primary);border-radius:var(--border-radius-lg);padding:20px;text-align:center;grid-column:1/-1}
.gl{font-size:12px;opacity:.6;margin-bottom:6px}
.gs{font-size:44px;font-weight:500;line-height:1}
.gs.pos{color:#86efac}.gs.neg{color:#fca5a5}.gs.neu{color:rgba(255,255,255,.4)}
.panel-wrap{margin-top:16px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;display:none}
.panel-wrap.open{display:block}
.phdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--color-background-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
.pname{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.psub{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.pclose{background:none;border:none;cursor:pointer;font-size:20px;color:var(--color-text-secondary);line-height:1;padding:0}
.pbody{padding:16px}
.ptag{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);margin:14px 0 6px}
.pdesc{font-size:13px;color:var(--color-text-primary);line-height:1.7}
.punits{display:flex;flex-direction:column;gap:4px}
.punit{font-size:12px;padding:7px 10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);color:var(--color-text-primary);line-height:1.5}
.punit strong{font-weight:500}
.wlink{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--color-text-secondary);text-decoration:none;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:5px 11px;margin-top:8px}
.wlink:hover{border-color:var(--color-border-primary);color:var(--color-text-primary)}
.listbox{margin-top:10px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:12px;font-size:11px;font-family:var(--font-mono);color:var(--color-text-primary);white-space:pre-wrap;line-height:1.7;max-height:320px;overflow-y:auto}
.empty{text-align:center;padding:40px 20px;color:var(--color-text-secondary);font-size:14px}
</style>

<div class="app">
<h2 class="sr-only">Team Bulgaria AoS Worlds 2026 matchup prediction matrix — full player lists</h2>
<div class="hdr">
  <div><div class="htitle">Team Bulgaria · AoS Worlds 2026</div><div class="hsub">click cells to cycle · click opponent header for army intel + list</div></div>
  <div class="rpills" id="rpills"></div>
</div>
<div class="maps" id="maps"></div>
<div class="tabs">
  <button class="tab on" onclick="showTab('matrix')">Matrix</button>
  <button class="tab" onclick="showTab('draw')">Draw</button>
  <button class="tab" onclick="showTab('summary')">Summary</button>
</div>
<div id="sec-matrix" class="sec on">
  <div class="nrow">
    <label>Opponent:</label>
    <select id="npick" onchange="renderMatrix()"></select>
    <button class="dbtn" id="dbtn" onclick="toggleDraw()">+ Add to draw</button>
  </div>
  <div class="leg">
    <div class="li"><div class="ls" style="background:#dcfce7;border-color:#16a34a"></div>BW 40+</div>
    <div class="li"><div class="ls" style="background:#d1fae5;border-color:#059669"></div>SW win</div>
    <div class="li"><div class="ls" style="background:#f1f0eb;border-color:#9e9b94"></div>Draw</div>
    <div class="li"><div class="ls" style="background:#fef3c7;border-color:#d97706"></div>SL loss</div>
    <div class="li"><div class="ls" style="background:#fee2e2;border-color:#dc2626"></div>BL 40+</div>
    <div class="li"><div class="ls" style="background:#ede9fe;border-color:#7c3aed"></div>Risky</div>
  </div>
  <div class="mscroll" id="mwrap"></div>
  <div class="panel-wrap" id="panel">
    <div class="phdr"><div><div class="pname" id="pname"></div><div class="psub" id="psub"></div></div><button class="pclose" onclick="closePanel()">×</button></div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>
<div id="sec-draw" class="sec">
  <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:10px">Select up to 6 nations you face at Worlds.</p>
  <input type="text" placeholder="Search…" style="margin-bottom:10px;width:100%;max-width:280px" oninput="renderDG(this.value)">
  <div class="ngrid" id="dgrid"></div>
  <div id="dsums"></div>
</div>
<div id="sec-summary" class="sec"><div id="sinner"></div></div>
</div>

<script>
const AC={"Daughters of Khaine":"#d4537e","Sylvaneth":"#639922","Stormcast Eternals":"#ca8a04","Seraphon":"#2563eb","Slaves to Darkness":"#6b7280","Disciples of Tzeentch":"#7c3aed","Blades of Khorne":"#dc2626","Soulblight Gravelords":"#4f46e5","Ogor Mawtribes":"#92400e","Lumineth Realm-lords":"#0284c7","Lumineth Realm-Lords":"#0284c7","Ironjawz":"#16a34a","Maggotkin of Nurgle":"#4d7c0f","Ossiarch Bonereapers":"#78716c","Flesh-eater Courts":"#9333ea","Idoneth Deepkin":"#0891b2","Kharadron Overlords":"#475569","Sons of Behemat":"#b45309","Nighthaunt":"#6366f1","Skaven":"#84796a","Cities of Sigmar":"#b45309","Hedonites of Slaanesh":"#db2777","Kruleboyz":"#65a30d","Gloomspite Gitz":"#854d0e","Helsmiths of Hashut":"#57534e"};
const ac=a=>AC[a]||"#9ca3af";
const AI={"Daughters of Khaine":{s:"Elite snake-aelf melee army built around Morathi. Extremely high damage output, fight-back abilities. Weak to shooting and ranged magic pressure.",k:["Morathi-Khaine — near-unkillable 2-part centerpiece","Blood Sisters — elite melee with mortal wounds on 6s","Khinerai — fast flying harassers","Cauldron of Blood — prayer support +1 attack aura","Krethusa / Hag Queens — secondary hero support"],u:"https://wahapedia.ru/aos4/factions/daughters-of-khaine/"},"Sylvaneth":{s:"Objective-controlling tree army using teleport via Wyldwoods. Strong magic, good board control. Struggles against fast armies that deny teleport.",k:["Alarielle — massive combat+magic monster","Kurnoth Hunters — elite ranged+melee battleline","Drycha — high-damage ambush piece","Spiterider Lancers — fast cavalry flankers","Warsong Revenant — spell+prayer support"],u:"https://wahapedia.ru/aos4/factions/sylvaneth/"},"Stormcast Eternals":{s:"Durable warriors with teleport-in deployment, strong shooting and utility. Multiple viable builds from shooting to melee bricks.",k:["Vanguard-Raptors — long-range precision shooting","Annihilators — teleporting melee elite hammers","Lord-Aquilor / Bastian — fast commander options","Vanguard-Palladors — mobile cavalry screens","Questor Soulsworn — durable combat heroes"],u:"https://wahapedia.ru/aos4/factions/stormcast-eternals/"},"Seraphon":{s:"Disciplined lizard army with excellent magic and durable battleline. Lord Kroak is one of the strongest wizards.",k:["Lord Kroak — arcane anchor, army-wide buffs","Bastiladon — ranged mortal damage + durable sponge","Saurus Oldblood on Carnosaur — combat centerpiece","Kroxigor — elite multi-damage melee","Raptadon Chargers — fast cavalry screens"],u:"https://wahapedia.ru/aos4/factions/seraphon/"},"Slaves to Darkness":{s:"Chaos Warriors built around Be'lakor or mortal warbands. Flexible, tough, excellent aura stacking.",k:["Be'lakor — aura of debuffs, very hard to kill","Chaos Chosen — elite melee hammer unit","Chaos Warriors — tough battleline anvil","Varanguard — fast heavy cavalry","Eternus — cavalry support hero"],u:"https://wahapedia.ru/aos4/factions/slaves-to-darkness/"},"Disciples of Tzeentch":{s:"Magic and destiny-manipulation faction. Excellent at denying with fate-dice. Tzaangor lists add melee threat.",k:["Lord of Change / Kairos — dominant wizard general","Tzaangor Enlightened — fast elite melee","Pink Horrors — split when destroyed","Flamers — mortal wound shooting","Curseling — spell-stealing hero"],u:"https://wahapedia.ru/aos4/factions/disciples-of-tzeentch/"},"Blades of Khorne":{s:"Aggressive melee army built around denying magic and piling mortal wounds. Bloodthirsters are powerful flyers.",k:["Wrath of Khorne Bloodthirster — fast flying monster","Bloodletters — endless daemonic infantry","Blood Warriors — tough mortal infantry","Skull Altar — prayer support terrain","Skulltaker — elite duelist hero"],u:"https://wahapedia.ru/aos4/factions/blades-of-khorne/"},"Soulblight Gravelords":{s:"Undead army with Vampire centerpieces. Prince Vhordrai and Mannfred are dominant threats. Blood Knights for speed.",k:["Prince Vhordrai — strongest vampire combat piece","Mannfred von Carstein — magic+combat general","Blood Knights — fast elite cavalry","Askurgan Trueblades — elite melee infantry","Barrow Guard — undead support infantry"],u:"https://wahapedia.ru/aos4/factions/soulblight-gravelords/"},"Ogor Mawtribes":{s:"Big bruiser army. Ironguts and Gluttons punch hard, Stonehorns are monstrous. Slow but hits like a train.",k:["Frostlord on Stonehorn — heavy cavalry monster","Ironguts — elite melee infantry","Ogor Gluttons — large melee battleline","Gnoblar Scraplauncher — mortar support","Butcher/Slaughtermaster — spell+prayer support"],u:"https://wahapedia.ru/aos4/factions/ogor-mawtribes/"},"Lumineth Realm-lords":{s:"High-aelf shooting and magic supremacy army. Sevireth and Eltharion are independent hero threats. Dawnriders for speed.",k:["Sevireth — mobile mortal wound machine","The Light of Eltharion — unkillable duelist hero","Lyrior Uthralle — magic+combat general","Vanari Dawnriders — fast cavalry hammers","Ellania & Ellathor — dual wizard/fighter"],u:"https://wahapedia.ru/aos4/factions/lumineth-realm-lords/"},"Ironjawz":{s:"Brutal orc melee army. Very fast with charge bonuses. Kragnos adds devastating impact hits.",k:["Kragnos — monstrous cavalry general","Brutes — elite melee infantry","Gore-gruntas — fast pig-riding cavalry","Zoggrok Anvilsmasha — repair+support","Tuskboss on Maw-grunta — heavy cavalry hero"],u:"https://wahapedia.ru/aos4/factions/ironjawz/"},"Maggotkin of Nurgle":{s:"Diseased attrition army. Extremely hard to kill. Rotigus and Glottkin are massive threats. Rotswords create unstoppable tide.",k:["Rotigus / Glottkin — massive daemon general","Rotswords — plague infantry hammers","Belga the Cystwitch — prayer+disease support","Harbinger of Decay — aura debuff hero","Plaguebearers — durable battleline"],u:"https://wahapedia.ru/aos4/factions/maggotkin-of-nurgle/"},"Ossiarch Bonereapers":{s:"Disciplined undead cavalry army. Kavalos Deathriders are fast and durable. Strong objective control.",k:["Arch-Kavalos Zandtos — fast cavalry general","Kavalos Deathriders — elite cavalry battleline","Liege-Kavalos — cavalry support hero","Mortek Triaxes — heavy siege equipment","Teratic Cohort — construct support unit"],u:"https://wahapedia.ru/aos4/factions/ossiarch-bonereapers/"},"Flesh-eater Courts":{s:"Delusional ghouls with monstrous flying centerpieces. Multiple Terrorgheists create extreme rend pressure.",k:["Ushoran — recursion-enabling general","Terrorgheist — death scream mortal wounds","Royal Zombie Dragon — heavy flyer","Abhorrant Ghoul King — hero support","Crypt Horrors — tough elite infantry"],u:"https://wahapedia.ru/aos4/factions/flesh-eater-courts/"},"Idoneth Deepkin":{s:"Aelf sea-cavalry with powerful tidal-phase mechanic. Morrsarr Guard are outstanding in combat. Best in turn 3.",k:["Akhelian Morrsarr Guard — elite eel cavalry","Akhelian Allopex — shark cavalry flankers","Eidolon of Mathlann — powerful magic+combat hero","Volturnos — cavalry support general","Mathaela — oracle support hero"],u:"https://wahapedia.ru/aos4/factions/idoneth-deepkin/"},"Kharadron Overlords":{s:"Aerial duardin gunboat faction. Ironclads and Frigates deploy troops deep. Strong alpha-strike potential.",k:["Arkanaut Ironclad — massive transport gunboat","Arkanaut Frigate — medium gunship","Skywardens — fast melee infantry","Brokk Grungsson — fast hero general","Arkanaut Company — embarked gunfighters"],u:"https://wahapedia.ru/aos4/factions/kharadron-overlords/"},"Sons of Behemat":{s:"Four mega-gargants. Enormous wounds, terrifying combat damage, very hard to shift off objectives.",k:["King Brodd — general with prayer support","Warstomper — agile gargant","Gatebreaker — defensive stomper","Beast-smasher — aggressive hybrid","Kragnos — optional monstrous ally"],u:"https://wahapedia.ru/aos4/factions/sons-of-behemat/"},"Nighthaunt":{s:"Fast ghostly spirits with ignore-terrain movement. High volume mortal wounds, good alpha potential.",k:["Lady Olynder — powerful debuff caster","Pyregheists — fast mortal wound hammers","Kurdoss Valentian — command denial hero","Krulghast Cruciator — fight-back buffer","Myrmourn Banshees — spell-eaters"],u:"https://wahapedia.ru/aos4/factions/nighthaunt/"},"Skaven":{s:"Horde of rats with powerful war machines and plague. Screaming Bell provides magic. Explosive but unreliable.",k:["Grey Seer on Screaming Bell — mobile magic engine","Rat Ogors — elite shock infantry","Plague Priest on Plague Furnace — plague support","Stormfiends — elite multi-weapon options","Brood Terror — large monster piece"],u:"https://wahapedia.ru/aos4/factions/skaven/"},"Cities of Sigmar":{s:"Mixed human+duardin+aelf forces with cavalry focus. Freeguild Cavaliers are fast and hit hard. Cannon support.",k:["Freeguild Cavaliers — fast melee cavalry","Tahlia Vedra — cavalry buff
