<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Bulgaria · AoS Worlds 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f4f1;color:#1a1916;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e0ddd6;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:50}
.logo{font-size:17px;font-weight:600}
.logo span{color:#2563eb}
.rounds{display:flex;gap:5px;flex-wrap:wrap}
.rbtn{padding:5px 12px;font-size:12px;font-weight:500;border:1px solid #d0cdc6;border-radius:20px;cursor:pointer;background:transparent;color:#6b6860}
.rbtn:hover{background:#f0efe9}
.rbtn.on{background:#1a1916;color:#fff;border-color:#1a1916}
.page{max-width:1400px;margin:0 auto;padding:16px}
.mapbar{background:#fff;border:1px solid #e0ddd6;border-radius:10px;padding:10px 16px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mapbar label{font-size:11px;font-weight:600;color:#6b6860;text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
.mchip{font-size:11px;color:#6b6860;padding:3px 10px;background:#f5f4f1;border:1px solid #e0ddd6;border-radius:8px}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{padding:8px 18px;font-size:13px;font-weight:500;border:1px solid #d0cdc6;border-radius:8px;cursor:pointer;background:transparent;color:#6b6860}
.tab:hover{color:#1a1916}
.tab.on{background:#1a1916;color:#fff;border-color:#1a1916}
.sec{display:none}.sec.on{display:block}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.topbar label{font-size:13px;color:#6b6860}
.nsel{padding:8px 12px;font-size:14px;border:1px solid #d0cdc6;border-radius:8px;background:#fff;color:#1a1916;flex:1;min-width:160px;max-width:280px}
.dbtn{padding:8px 16px;font-size:12px;font-weight:600;border:1px solid #d0cdc6;border-radius:8px;cursor:pointer;background:transparent;color:#6b6860}
.dbtn.on{background:#dcfce7;color:#14532d;border-color:#16a34a}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.li{display:flex;align-items:center;gap:4px;font-size:11px;color:#6b6860}
.ls{width:22px;height:13px;border-radius:3px;border:1px solid}
.card{background:#fff;border:1px solid #e0ddd6;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;font-size:12px;width:100%}
table th{padding:7px 6px;font-weight:600;color:#6b6860;border-bottom:1px solid #e0ddd6;background:#fff;font-size:11px;white-space:nowrap;text-align:center}
th.corner{min-width:145px;text-align:left;padding-left:14px;position:sticky;left:0;z-index:5;background:#fff;border-right:1px solid #e0ddd6}
.oh{cursor:pointer;border-left:1px solid #f0efe9}
.oh:hover{background:#f5f4f1}
.abar{height:3px;border-radius:2px;margin:0 auto 4px;width:30px}
.on1{font-size:11px;font-weight:600;color:#1a1916;display:block}
.on2{font-size:10px;color:#9e9b94;display:block}
tbody tr:hover{background:#fafaf8}
tbody td{padding:3px 4px;border-bottom:1px solid #f0efe9;border-left:1px solid #f0efe9;text-align:center;vertical-align:middle}
td.bgr{position:sticky;left:0;background:#fff;border-right:1px solid #e0ddd6;border-left:none;padding:7px 10px 7px 14px;text-align:left;z-index:2}
.bn{font-size:13px;font-weight:600;color:#1a1916}
.ba{font-size:10px;color:#9e9b94;margin-top:2px;display:flex;align-items:center;gap:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%}
.cb{width:54px;height:30px;border:1px solid #e0ddd6;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;background:transparent;color:#9e9b94;transition:transform .1s}
.cb:hover{transform:scale(1.1)}
.cb:active{transform:scale(.93)}
.cb.BW{background:#dcfce7;color:#14532d;border-color:#16a34a}
.cb.SW{background:#d1fae5;color:#064e3b;border-color:#059669}
.cb.D{background:#f1f0eb;color:#3d3b34;border-color:#9e9b94}
.cb.SL{background:#fef3c7;color:#78350f;border-color:#d97706}
.cb.BL{background:#fee2e2;color:#7f1d1d;border-color:#dc2626}
.cb.R{background:#ede9fe;color:#2e1065;border-color:#7c3aed}
/* panel */
.pnl{background:#fff;border:1px solid #e0ddd6;border-radius:12px;margin-top:16px;overflow:hidden;display:none}
.pnl.open{display:block}
.phd{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;background:#f5f4f1;border-bottom:1px solid #e0ddd6}
.pname{font-size:15px;font-weight:600;color:#1a1916}
.psub{font-size:12px;color:#6b6860;margin-top:3px}
.pcls{background:none;border:none;cursor:pointer;font-size:22px;color:#6b6860;line-height:1}
.pbody{padding:16px}
.ptag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9e9b94;margin:14px 0 6px}
.pdesc{font-size:13px;color:#1a1916;line-height:1.7}
.pu{font-size:12px;padding:7px 10px;background:#f5f4f1;border-radius:8px;margin-bottom:4px;line-height:1.5}
.pu strong{font-weight:600}
.wl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#6b6860;text-decoration:none;border:1px solid #e0ddd6;border-radius:8px;padding:5px 12px;margin-top:8px}
.wl:hover{border-color:#9e9b94;color:#1a1916}
.lb{background:#f5f4f1;border:1px solid #e0ddd6;border-radius:8px;padding:12px;font-size:11px;font-family:monospace;white-space:pre-wrap;line-height:1.7;max-height:340px;overflow-y:auto;margin-top:10px;color:#1a1916}
/* draw */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:7px;margin-bottom:18px}
.nc{background:#fff;border:1px solid #e0ddd6;border-radius:10px;padding:11px 13px;cursor:pointer}
.nc:hover{border-color:#9e9b94}
.nc.drn{border-color:#16a34a;background:#f0fdf4}
.ncn{font-size:13px;font-weight:600;color:#1a1916}
.nbg{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;background:#dcfce7;color:#14532d;border:1px solid #16a34a;margin-left:4px;vertical-align:middle}
.ncs{font-size:10px;color:#9e9b94;margin-top:4px;line-height:1.5}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:10px}
.dcard{background:#fff;border:1px solid #e0ddd6;border-radius:12px;padding:15px}
.dch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dcn{font-size:15px;font-weight:600;color:#1a1916}
.dsc{font-size:20px;font-weight:700}
.pos{color:#16a34a}.neg{color:#dc2626}.neu{color:#9e9b94}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;border:1px solid #e0ddd6;color:#6b6860;background:#f5f4f1}
.chip.BW{background:#dcfce7;color:#14532d;border-color:#16a34a}
.chip.SW{background:#d1fae5;color:#064e3b;border-color:#059669}
.chip.D{background:#f1f0eb;color:#3d3b34;border-color:#9e9b94}
.chip.SL{background:#fef3c7;color:#78350f;border-color:#d97706}
.chip.BL{background:#fee2e2;color:#7f1d1d;border-color:#dc2626}
.chip.R{background:#ede9fe;color:#2e1065;border-color:#7c3aed}
.dlink{font-size:11px;color:#2563eb;background:none;border:none;cursor:pointer;padding:4px 0;margin-top:4px;display:block}
/* summary */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.scard{background:#fff;border:1px solid #e0ddd6;border-radius:12px;padding:20px;text-align:center}
.sn{font-size:14px;font-weight:600;color:#1a1916;margin-bottom:8px}
.ss{font-size:36px;font-weight:700;line-height:1}
.ssb{font-size:11px;color:#9e9b94;margin-top:5px}
.grand{background:#1a1916;color:#fff;border-radius:12px;padding:24px;text-align:center;grid-column:1/-1}
.gl{font-size:12px;opacity:.6;margin-bottom:8px}
.gs{font-size:52px;font-weight:700;line-height:1}
.gs.pos{color:#86efac}.gs.neg{color:#fca5a5}.gs.neu{color:rgba(255,255,255,.4)}
.scale{font-size:12px;color:#9e9b94;margin-top:16px;text-align:center}
.empty{text-align:center;padding:48px;color:#9e9b94;font-size:14px}
@media(max-width:640px){.logo{font-size:14px}.cb{width:44px;height:28px;font-size:10px}th.corner{min-width:120px}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Team <span>Bulgaria</span> · AoS Worlds 2026</div>
  <div class="rounds" id="rpills"></div>
</div>

<div class="page">
  <div class="mapbar" id="mapbar"></div>

  <div class="tabs">
    <button class="tab on" onclick="showTab('matrix')">Matrix</button>
    <button class="tab" onclick="showTab('draw')">Draw</button>
    <button class="tab" onclick="showTab('summary')">Summary</button>
  </div>

  <div id="sec-matrix" class="sec on">
    <div class="topbar">
      <label>Opponent nation:</label>
      <select class="nsel" id="npick" onchange="renderMatrix()"></select>
      <button class="dbtn" id="dbtn" onclick="toggleDraw()">+ Add to draw</button>
    </div>
    <div class="leg">
      <div class="li"><div class="ls" style="background:#dcfce7;border-color:#16a34a"></div>BW 40+ win</div>
      <div class="li"><div class="ls" style="background:#d1fae5;border-color:#059669"></div>SW win</div>
      <div class="li"><div class="ls" style="background:#f1f0eb;border-color:#9e9b94"></div>Draw</div>
      <div class="li"><div class="ls" style="background:#fef3c7;border-color:#d97706"></div>SL loss</div>
      <div class="li"><div class="ls" style="background:#fee2e2;border-color:#dc2626"></div>BL 40+</div>
      <div class="li"><div class="ls" style="background:#ede9fe;border-color:#7c3aed"></div>Risky</div>
      <span style="font-size:11px;color:#9e9b94;margin-left:auto">tap opponent header for army intel + list</span>
    </div>
    <div class="card"><div class="tscroll" id="mwrap"></div></div>
    <div class="pnl" id="pnl">
      <div class="phd">
        <div><div class="pname" id="pname"></div><div class="psub" id="psub"></div></div>
        <button class="pcls" onclick="closePnl()">×</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </div>
  </div>

  <div id="sec-draw" class="sec">
    <p style="font-size:13px;color:#6b6860;margin-bottom:12px">Select up to 6 nations you face at Worlds. They appear in summary.</p>
    <input type="text" placeholder="Search nation…" style="width:100%;max-width:300px;margin-bottom:12px;padding:8px 12px;border:1px solid #d0cdc6;border-radius:8px;font-size:14px" oninput="renderDG(this.value)">
    <div class="ngrid" id="dgrid"></div>
    <div id="dsums"></div>
  </div>

  <div id="sec-summary" class="sec"><div id="sinner"></div></div>
</div>

const AC={"Daughters of Khaine":"#d4537e","Sylvaneth":"#639922","Stormcast Eternals":"#ca8a04","Seraphon":"#2563eb","Slaves to Darkness":"#6b7280","Disciples of Tzeentch":"#7c3aed","Blades of Khorne":"#dc2626","Soulblight Gravelords":"#4f46e5","Ogor Mawtribes":"#92400e","Lumineth Realm-lords":"#0284c7","Lumineth Realm-Lords":"#0284c7","Ironjawz":"#16a34a","Maggotkin of Nurgle":"#4d7c0f","Ossiarch Bonereapers":"#78716c","Flesh-eater Courts":"#9333ea","Idoneth Deepkin":"#0891b2","Kharadron Overlords":"#475569","Sons of Behemat":"#b45309","Nighthaunt":"#6366f1","Skaven":"#84796a","Cities of Sigmar":"#b45309","Hedonites of Slaanesh":"#db2777","Kruleboyz":"#65a30d","Gloomspite Gitz":"#854d0e","Helsmiths of Hashut":"#57534e"};

const AI={"Daughters of Khaine":{s:"Elite snake-aelf melee army built around Morathi. Extremely high damage output, fight-back abilities. Weak to shooting and ranged magic pressure.",k:["Morathi-Khaine — near-unkillable 2-part centerpiece","Blood Sisters — elite melee with mortal wounds on 6s","Khinerai — fast flying harassers","Cauldron of Blood — prayer support +1 attack aura","Krethusa / Hag Queens — secondary hero support"],u:"https://wahapedia.ru/aos4/factions/daughters-of-khaine/"},"Sylvaneth":{s:"Objective-controlling tree army using teleport via Wyldwoods. Strong magic, good board control. Struggles against fast armies that deny teleport.",k:["Alarielle — massive combat+magic monster","Kurnoth Hunters — elite ranged+melee battleline","Drycha — high-damage ambush piece","Spiterider Lancers — fast cavalry flankers","Warsong Revenant — spell+prayer support"],u:"https://wahapedia.ru/aos4/factions/sylvaneth/"},"Stormcast Eternals":{s:"Durable warriors with teleport-in deployment, strong shooting and utility. Multiple viable builds from shooting to melee bricks.",k:["Vanguard-Raptors — long-range precision shooting","Annihilators — teleporting melee elite hammers","Lord-Aquilor / Bastian — fast commander options","Vanguard-Palladors — mobile cavalry screens","Questor Soulsworn — durable combat heroes"],u:"https://wahapedia.ru/aos4/factions/stormcast-eternals/"},"Seraphon":{s:"Disciplined lizard army with excellent magic and durable battleline. Lord Kroak is one of the strongest wizards.",k:["Lord Kroak — arcane anchor, army-wide buffs","Bastiladon — ranged mortal damage + durable sponge","Saurus Oldblood on Carnosaur — combat centerpiece","Kroxigor — elite multi-damage melee","Raptadon Chargers — fast cavalry screens"],u:"https://wahapedia.ru/aos4/factions/seraphon/"},"Slaves to Darkness":{s:"Chaos Warriors built around Be'lakor or mortal warbands. Flexible, tough, excellent aura stacking.",k:["Be'lakor — aura of debuffs, very hard to kill","Chaos Chosen — elite melee hammer unit","Chaos Warriors — tough battleline anvil","Varanguard — fast heavy cavalry","Eternus — cavalry support hero"],u:"https://wahapedia.ru/aos4/factions/slaves-to-darkness/"},"Disciples of Tzeentch":{s:"Magic and destiny-manipulation faction. Excellent at denying with fate-dice. Tzaangor lists add melee threat.",k:["Lord of Change / Kairos — dominant wizard general","Tzaangor Enlightened — fast elite melee","Pink Horrors — split when destroyed","Flamers — mortal wound shooting","Curseling — spell-stealing hero"],u:"https://wahapedia.ru/aos4/factions/disciples-of-tzeentch/"},"Blades of Khorne":{s:"Aggressive melee army built around denying magic and piling mortal wounds. Bloodthirsters are powerful flyers.",k:["Wrath of Khorne Bloodthirster — fast flying monster","Bloodletters — endless daemonic infantry","Blood Warriors — tough mortal infantry","Skull Altar — prayer support terrain","Skulltaker — elite duelist hero"],u:"https://wahapedia.ru/aos4/factions/blades-of-khorne/"},"Soulblight Gravelords":{s:"Undead army with Vampire centerpieces. Prince Vhordrai and Mannfred are dominant threats. Blood Knights for speed.",k:["Prince Vhordrai — strongest vampire combat piece","Mannfred von Carstein — magic+combat general","Blood Knights — fast elite cavalry","Askurgan Trueblades — elite melee infantry","Barrow Guard — undead support infantry"],u:"https://wahapedia.ru/aos4/factions/soulblight-gravelords/"},"Ogor Mawtribes":{s:"Big bruiser army. Ironguts and Gluttons punch hard, Stonehorns are monstrous. Slow but hits like a train.",k:["Frostlord on Stonehorn — heavy cavalry monster","Ironguts — elite melee infantry","Ogor Gluttons — large melee battleline","Gnoblar Scraplauncher — mortar support","Butcher/Slaughtermaster — spell+prayer support"],u:"https://wahapedia.ru/aos4/factions/ogor-mawtribes/"},"Lumineth Realm-lords":{s:"High-aelf shooting and magic supremacy army. Sevireth and Eltharion are independent hero threats.",k:["Sevireth — mobile mortal wound machine","The Light of Eltharion — unkillable duelist hero","Lyrior Uthralle — magic+combat general","Vanari Dawnriders — fast cavalry hammers","Ellania and Ellathor — dual wizard/fighter"],u:"https://wahapedia.ru/aos4/factions/lumineth-realm-lords/"},"Ironjawz":{s:"Brutal orc melee army. Very fast with charge bonuses. Kragnos adds devastating impact hits.",k:["Kragnos — monstrous cavalry general","Brutes — elite melee infantry","Gore-gruntas — fast pig-riding cavalry","Zoggrok Anvilsmasha — repair+support","Tuskboss on Maw-grunta — heavy cavalry hero"],u:"https://wahapedia.ru/aos4/factions/ironjawz/"},"Maggotkin of Nurgle":{s:"Diseased attrition army. Extremely hard to kill. Rotigus and Glottkin are massive threats. Rotswords create unstoppable tide.",k:["Rotigus / Glottkin — massive daemon general","Rotswords — plague infantry hammers","Belga the Cystwitch — prayer+disease support","Harbinger of Decay — aura debuff hero","Plaguebearers — durable battleline"],u:"https://wahapedia.ru/aos4/factions/maggotkin-of-nurgle/"},"Ossiarch Bonereapers":{s:"Disciplined undead cavalry army. Kavalos Deathriders are fast and durable. Strong objective control.",k:["Arch-Kavalos Zandtos — fast cavalry general","Kavalos Deathriders — elite cavalry battleline","Liege-Kavalos — cavalry support hero","Mortek Triaxes — heavy siege equipment","Teratic Cohort — construct support unit"],u:"https://wahapedia.ru/aos4/factions/ossiarch-bonereapers/"},"Flesh-eater Courts":{s:"Delusional ghouls with monstrous flying centerpieces. Multiple Terrorgheists create extreme rend pressure.",k:["Ushoran — recursion-enabling general","Terrorgheist — death scream mortal wounds","Royal Zombie Dragon — heavy flyer","Abhorrant Ghoul King — hero support","Crypt Horrors — tough elite infantry"],u:"https://wahapedia.ru/aos4/factions/flesh-eater-courts/"},"Idoneth Deepkin":{s:"Aelf sea-cavalry with powerful tidal-phase mechanic. Morrsarr Guard are outstanding in combat. Best in turn 3.",k:["Akhelian Morrsarr Guard — elite eel cavalry","Akhelian Allopex — shark cavalry flankers","Eidolon of Mathlann — powerful magic+combat hero","Volturnos — cavalry support general","Mathaela — oracle support hero"],u:"https://wahapedia.ru/aos4/factions/idoneth-deepkin/"},"Kharadron Overlords":{s:"Aerial duardin gunboat faction. Ironclads and Frigates deploy troops deep. Strong alpha-strike potential.",k:["Arkanaut Ironclad — massive transport gunboat","Arkanaut Frigate — medium gunship","Skywardens — fast melee infantry","Brokk Grungsson — fast hero general","Arkanaut Company — embarked gunfighters"],u:"https://wahapedia.ru/aos4/factions/kharadron-overlords/"},"Sons of Behemat":{s:"Four mega-gargants. Enormous wounds, terrifying combat damage, very hard to shift off objectives.",k:["King Brodd — general with prayer support","Warstomper — agile gargant","Gatebreaker — defensive stomper","Beast-smasher — aggressive hybrid","Kragnos — optional monstrous ally"],u:"https://wahapedia.ru/aos4/factions/sons-of-behemat/"},"Nighthaunt":{s:"Fast ghostly spirits with ignore-terrain movement. High volume mortal wounds, good alpha potential.",k:["Lady Olynder — powerful debuff caster","Pyregheists — fast mortal wound hammers","Kurdoss Valentian — command denial hero","Krulghast Cruciator — fight-back buffer","Myrmourn Banshees — spell-eaters"],u:"https://wahapedia.ru/aos4/factions/nighthaunt/"},"Skaven":{s:"Horde of rats with powerful war machines and plague. Screaming Bell provides magic. Explosive but unreliable.",k:["Grey Seer on Screaming Bell — mobile magic engine","Rat Ogors — elite shock infantry","Plague Priest on Plague Furnace — plague support","Stormfiends — elite multi-weapon options","Brood Terror — large monster piece"],u:"https://wahapedia.ru/aos4/factions/skaven/"},"Cities of Sigmar":{s:"Mixed human+duardin+aelf forces with cavalry focus. Freeguild Cavaliers are fast and hit hard. Cannon support.",k:["Freeguild Cavaliers — fast melee cavalry","Tahlia Vedra — cavalry buff general","Ironweld Great Cannon — long-range shooting","Fusil-Major on Ogor Warhulk — combat+shooting hybrid","Freeguild Fusiliers — ranged infantry"],u:"https://wahapedia.ru/aos4/factions/cities-of-sigmar/"},"Hedonites of Slaanesh":{s:"Fast pursuit-focused chaos army. Strikes first in combat. Glutos anchors the list.",k:["Glutos Orscollion — powerful spellcaster general","Myrmidesh Painbringers — precision melee elite","Blissbarb Archers — mobile shooting","Sigvald — fast duelist hero","Symbaresh Twinsouls — fight-back infantry"],u:"https://wahapedia.ru/aos4/factions/hedonites-of-slaanesh/"},"Kruleboyz":{s:"Sneaky swamp orc army with poisoned weapons. Gutrippaz core, fast Killaboss. Monsta-killaz for counter-monster.",k:["Killaboss on Great Gnashtoof — fast mounted hero","Gutrippaz — poisoned blade battleline","Kruleboyz Monsta-killaz — anti-large unit","Man-skewer Boltboyz — ranged support","Swampcalla Shaman — debuff caster"],u:"https://wahapedia.ru/aos4/factions/kruleboyz/"},"Gloomspite Gitz":{s:"Massive goblin horde with moon-powered buffs. Loonsmasha Fanatics are devastating surprise units.",k:["Skragrott the Loonking — moon-buff wizard","Loonsmasha Fanatics — surprise ball-and-chain","Moonclan Shootas — large ranged battleline","Droggz Da Sunchompa — troll hero","Fellwater Troggoths — regenerating trolls"],u:"https://wahapedia.ru/aos4/factions/gloomspite-gitz/"},"Helsmiths of Hashut":{s:"New Chaos Duardin faction. Artillery focus with Deathshrieker Rockets and Bombards.",k:["Urak Taar — unique daemonsmith general","Infernal Cohort — mixed melee infantry","Dominator Engine — combat construct","Deathshrieker Rocket Battery — long-range artillery","War Despot — overseer support hero"],u:"https://wahapedia.ru/aos4/factions/helsmiths-of-hashut/"}};

function load(){try{const d=localStorage.getItem('bgaos_p');if(d)preds=JSON.parse(d);const dr=localStorage.getItem('bgaos_d');if(dr)drawn=new Set(JSON.parse(dr));}catch(e){}}

function pk(n,b,o){return n+'|'+b+'|'+o}
function gp(n,b,o){return preds[pk(n,b,o)]||null}
function cy(n,b,o){const c=gp(n,b,o),i=CY.indexOf(c),nx=CY[(i+1)%CY.length];if(nx===null)delete preds[pk(n,b,o)];else preds[pk(n,b,o)]=nx;save();renderMatrix();renderSums();renderSum();}

function renderMatrix(){
  const nn=document.getElementById('npick').value;
  const nat=NATIONS.find(n=>n.name===nn);
  const b=document.getElementById('dbtn');b.textContent=drawn.has(nn)?'★ In draw':'+ Add to draw';b.className='dbtn'+(drawn.has(nn)?' on':'');
  if(!nat){document.getElementById('mwrap').innerHTML='';return;}
  let h=`<table><thead><tr><th class="corner">Bulgaria / ${nn}</th>`;
  nat.players.forEach(p=>{const c=ac(p.army);h+=`<th class="oh" onclick="openP('${p.name.replace(/'/g,"\'")}','${p.army.replace(/'/g,"\'")}','${nn}')"><div class="abar" style="background:${c}"></div><span class="on1">${p.name.split(' ')[0]}</span><span class="on2">${as(p.army)}</span></th>`;});
  h+=`</tr></thead><tbody>`;
  BG.forEach((bg,bi)=>{const bc=ac(bg.army);h+=`<tr><td class="bgr"><div class="bn">${bg.name}</div><div class="ba"><span class="dot" style="background:${bc}"></span>${as(bg.army)}</div></td>`;nat.players.forEach((_,oi)=>{const v=gp(nn,bi,oi),cls=v||'';h+=`<td><button class="cb ${cls}" onclick="cy('${nn}',${bi},${oi})">${v||'–'}</button></td>`;});h+=`</tr>`;});
  h+=`</tbody></table>`;
  document.getElementById('mwrap').innerHTML=h;
}

function openP(pname,army,nation){
  const info=AI[army]||AI[army.replace('Lumineth Realm-Lords','Lumineth Realm-lords')];
  const c=ac(army);
  const lst=PL[pname.toLowerCase()];
  document.getElementById('pname').textContent=pname;
  document.getElementById('psub').innerHTML=`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};margin-right:5px;vertical-align:middle"></span>${army} · ${nation}`;
  let body='';
  // Side-by-side layout: army info left, list right
  if(info){
    body+=`<div style="display:flex;gap:16px;flex-wrap:wrap">`;
    body+=`<div style="flex:1;min-width:220px">`;
    body+=`<div class="ptag">Army overview</div><div class="pdesc">${info.s}</div>`;
    body+=`<div class="ptag">Key units</div>`;
    info.k.forEach(k=>{const p=k.split('—');body+=`<div class="pu"><strong>${p[0].trim()}</strong>${p[1]?' — '+p[1].trim():''}</div>`;});
    body+=`<a class="wl" href="${info.u}" target="_blank">Full rules on Wahapedia ↗</a>`;
    body+=`</div>`;
    body+=`<div style="flex:1;min-width:220px">`;
    body+=`<div class="ptag">Tournament list</div>`;
    if(lst){body+=`<div class="lb">${lst.replace(/\\n/g,'\n')}</div>`;}
    else{body+=`<p style="font-size:12px;color:#9e9b94;margin-top:8px">List not extracted.</p>`;}
    body+=`</div>`;
    body+=`</div>`;
  } else {
    body+=`<div class="ptag">Tournament list</div>`;
    if(lst){body+=`<div class="lb">${lst.replace(/\\n/g,'\n')}</div>`;}
    else{body+=`<p style="font-size:12px;color:#9e9b94">List not extracted — check the Worlds PDF.</p>`;}
  }
  document.getElementById('pbody').innerHTML=body;
  document.getElementById('pnl').classList.add('open');
}

function showTab(t){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));const m={matrix:0,draw:1,summary:2};document.querySelectorAll('.tab')[m[t]].classList.add('on');document.getElementById('sec-'+t).classList.add('on');if(t==='draw')renderDG('');if(t==='summary')renderSum();}

function renderDG(f=''){
  let h='';
  NATIONS.filter(n=>!f||n.name.toLowerCase().includes(f.toLowerCase())).forEach(n=>{
    const d=drawn.has(n.name);
    const aa=[...new Set(n.players.map(p=>p.army))];
    h+=`<div class="nc${d?' drn':''}" onclick="toggleDN('${n.name}')"><div class="ncn">${n.name}${d?'<span class="nbg">drawn</span>':''}</div><div class="ncs">${aa.slice(0,3).map(a=>`<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${ac(a)};margin-right:2px;vertical-align:middle"></span>${as(a)}`).join('  ')}</div></div>`;
  });
  document.getElementById('dgrid').innerHTML=h;
  renderSums();
}
function toggleDN(name){if(drawn.has(name))drawn.delete(name);else{if(drawn.size>=6){alert('Max 6 nations');return;}drawn.add(name);}save();refSel();renderDG('');renderSum();const c=document.getElementById('npick').value;if(c)renderMatrix();}

function renderSums(){
  const c=document.getElementById('dsums');
  if(!drawn.size){c.innerHTML='';return;}
  let h=`<div style="font-size:14px;font-weight:600;color:#1a1916;margin-bottom:10px">Drawn nations</div><div class="dcards">`;
  drawn.forEach(nn=>{
    const nat=NATIONS.find(n=>n.name===nn);let tot=0,fil=0;
    const chips=BG.map((bg,bi)=>{let bv=-99,best=null;nat.players.forEach((_,oi)=>{const v=gp(nn,bi,oi);if(v&&SC[v]>bv){bv=SC[v];best=v;}});if(best){tot+=SC[best];fil++;}return{bg,best};});
    const sc=tot>0?'pos':tot<0?'neg':'neu';
    h+=`<div class="dcard"><div class="dch"><div class="dcn">${nn}</div><div class="dsc ${sc}">${tot>0?'+':''}${tot.toFixed(1)}</div></div><div style="font-size:11px;color:#9e9b94">${fil}/8 predictions</div><div class="chips">`;
    chips.forEach(ch=>{h+=`<span class="chip${ch.best?' '+ch.best:''}">${ch.bg.name.split(' ')[0]}: ${ch.best||'–'}</span>`;});
    h+=`</div><button class="dlink" onclick="document.getElementById('npick').value='${nn}';renderMatrix();showTab('matrix')">→ Open full matrix</button></div>`;
  });
  h+=`</div>`;c.innerHTML=h;
}

function renderSum(){
  const c=document.getElementById('sinner');
  if(!drawn.size){c.innerHTML=`<div class="empty">Add nations in the Draw tab first.</div>`;return;}
  let grand=0,h=`<div class="sgrid">`;
  drawn.forEach(nn=>{
    const nat=NATIONS.find(n=>n.name===nn);let tot=0,fil=0;
    BG.forEach((_,bi)=>nat.players.forEach((_,oi)=>{const v=gp(nn,bi,oi);if(v){fil++;tot+=SC[v];}}));
    grand+=tot;const sc=tot>0?'pos':tot<0?'neg':'neu';
    h+=`<div class="scard"><div class="sn">${nn}</div><div class="ss ${sc}">${tot>0?'+':''}${tot.toFixed(1)}</div><div class="ssb">${fil}/64 cells</div></div>`;
  });
  const gsc=grand>0?'pos':grand<0?'neg':'neu';
  h+=`<div class="grand"><div class="gl">TEAM TOTAL · ${drawn.size} nations</div><div class="gs ${gsc}">${grand>0?'+':''}${grand.toFixed(1)}</div></div></div>`;
  h+=`<p class="scale">BW = +2 &nbsp; SW = +1 &nbsp; D = 0 &nbsp; SL = -1 &nbsp; BL = -2 &nbsp; R = +0.5</p>`;
  c.innerHTML=h;
}

load();initPills();renderMaps();initSel();renderMatrix();
</script>
